# AboveTustin configuration.
#
# Copy to ~/.config/abovetustin/config.toml, set the receiver position, and
# keep it out of any repository: the position is where you live. Values with
# units are strings with units ("1.2 mi", "2 km", "30 s"); angles are plain
# numbers in degrees.

[receiver]
# Where the antenna is. These are the coordinates of Tustin, CA.
latitude_deg = 33.7458
longitude_deg = -117.8261

[source]
# readsb's aircraft.json, usually served by tar1090.
url = "http://localhost/tar1090/data/aircraft.json"
poll_interval = "1 s"
timeout = "10 s"

[tracker]
# An aircraft is in the alarm zone when it is closer than distance_alarm or
# higher above the horizon than elevation_alarm_deg. These are the values
# that ran in Tustin; a quieter sky may want a wider zone.
distance_alarm = "1.2 mi"
elevation_alarm_deg = 50
# Consecutive polls out of the zone before the sighting is posted.
wait_updates = 4
# A position older than this counts as the aircraft being gone.
max_position_age = "30 s"

[log]
# Every sighting is appended here as one JSON line, whether or not it is posted.
path = "~/.local/share/abovetustin/sightings.jsonl"

[render]
# Map image of the track, screenshotted from tar1090 in a headless browser.
enabled = true
url = "http://localhost/tar1090/"
zoom = 11
width_px = 1280
height_px = 720
# How each image is framed:
#   "grid"      the receiver position snapped to a grid of grid_deg, so that
#               many posts do not all point at one spot (the default)
#   "receiver"  the receiver itself
#   "aircraft"  the aircraft at its closest approach
#   "track"     the whole trail fitted to the frame, zoomed in no further than zoom
center = "grid"
grid_deg = 0.1
# Draw the receiver marker and distance rings around it.
show_receiver = false
ring_distances = ["1 mi", "2 mi", "5 mi"]
# Playwright browser channel: "chrome" or "msedge" for an installed browser,
# "" for the chromium that `playwright install chromium` downloads.
browser_channel = "chrome"
# The page is reopened this often, while nothing is tracked, to bound its memory.
reload_after = "1 h"
image_dir = "~/.local/share/abovetustin/images"

# Anything tar1090 takes on its URL is passed through as written and wins over
# the defaults above. true means a bare flag. For example:
#   enableLabels = true         aircraft labels (tar1090's L key)
#   extendedLabels = 2          label detail, 0 to 3 (the O key, pressed that many times)
#   baseMap = "esri"            osm, osm_de, esri, esri_gray, esri_streets, mapbox_dark, ...
#   overlays = "noaa_radar"     comma-separated: nexrad, noaa_radar, noaa_sat, rainviewer_radar, tfrs, sua, openaip
#   mapDim = 0.45               how much to dim the base map, with the MapDim toggle below
[render.tar1090]

# Switches from tar1090's settings menu (the key names it stores them under):
#   MapDim, useRouteAPI, darkMode, darkerColors, ColoredTrails, monochromeMarkers, ...
[render.toggles]

[post]
# The text of a post. Placeholders are ${name}; the full list is in
# src/abovetustin/post/template.py. This is the v1 template.
template = "#${flight} : ${dist_mi} mi away @ ${alt_ft} ft and ${el}° frm hrzn, heading ${heading} @ ${speed_mph}mi/h ${time}."
# Appended to every post, after any rule tags, while there is room.
hashtags = ["#ADSB", "#readsb"]
# Clock for ${time}, ${date} and the hours/weekdays rules. Default: system local.
# timezone = "America/Los_Angeles"

# Rules add a hashtag, swap in a different template, or both, when every
# listed condition holds. Ranges are inclusive. Conditions: altitude_min/max,
# distance_min/max, speed_min/max, vertical_rate_min/max (strings with units),
# elevation_min_deg/max_deg, heading_min_deg/max_deg (may wrap through north),
# hours ("23:00-07:00", may cross midnight), weekdays (["sat", "sun"]),
# anonymous and on_ground (true/false). These are v1's hashtags.
[[post.rules]]
tag = "#AfterHours"
hours = "23:00-07:00"

[[post.rules]]
tag = "#2CloseForComfort"
altitude_max = "1000 ft"

[[post.rules]]
# v1 tuned this for the approach into John Wayne Airport. Set the heading band
# for your own airport, or drop the rule.
tag = "#ProbablyLanding"
altitude_min = "1000 ft"
altitude_max = "2500 ft"
heading_min_deg = 157.5
heading_max_deg = 247.5

[[post.rules]]
tag = "#UpInTheClouds"
altitude_min = "20000 ft"
altitude_max = "35000 ft"

[[post.rules]]
tag = "#WayTheHeckUpThere"
altitude_min = "35000 ft"

[[post.rules]]
tag = "#MovingQuickly"
speed_min = "300 mph"
speed_max = "500 mph"

[[post.rules]]
tag = "#FlyingFast"
speed_min = "500 mph"

[[post.rules]]
# MLAT and TIS-B addresses identify nothing, so do not pretend they are a flight.
anonymous = true
template = "Unidentified aircraft ${dist_mi} mi away @ ${alt_ft} ft and ${el}° frm hrzn, heading ${heading} @ ${speed_mph}mi/h ${time}."

# [bluesky]
# Create an app password in Bluesky's settings; never use the account password.
# Without this section the bot only logs and renders.
# handle = "yourbot.bsky.social"
# app_password = "xxxx-xxxx-xxxx-xxxx"
